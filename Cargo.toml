[package]
name = "chug"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
glob = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T115: the one new dependency — SHA-256 for the delegate goal-integrity
# echoes (`goal_sha256` on the launch result and the child's `run_start`
# line). Ecosystem standard, lowercase-hex output comparable with external
# `shasum -a 256` for out-of-band verification; a bespoke FNV/xx hash would
# invent a one-off primitive to save one small pure-Rust dep.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
serde_yaml = "0.9"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
