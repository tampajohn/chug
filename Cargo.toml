[package]
name = "chug"
version = "0.17.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
glob = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T115: the one new dependency — SHA-256 for the delegate goal-integrity
# echoes (`goal_sha256` on the launch result and the child's `run_start`
# line). Ecosystem standard, lowercase-hex output comparable with external
# `shasum -a 256` for out-of-band verification; a bespoke FNV/xx hash would
# invent a one-off primitive to save one small pure-Rust dep.
sha2 = "0.10"
# T204 phase 1 (F15): the baked-in judge daemon's inference stack, ALL behind
# the `daemon` feature — off by default, so the hot path (every `chug run`)
# keeps its lean compile graph with zero candle in it (feature-off build is
# pinned by tests/daemon_feature_off.rs's cargo-tree check). Weights are NOT
# in the release tarball (~650MB); the daemon downloads via hf-hub on first
# load into the standard HF cache and serves over a 0600 unix socket.
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
hf-hub = { version = "0.4", optional = true, default-features = false, features = [
    "ureq",
    "rustls-tls",
] }
tokenizers = { version = "0.22", optional = true, default-features = false, features = [
    "onig",
] }

[features]
default = []
# metal on Apple Silicon (the primary release leg), plain cpu elsewhere —
# candle-core is declared twice (generic optional + the target section below
# re-declaring it with the metal feature; cargo merges the feature sets), so
# `--features daemon` does the right thing on every release target without a
# second feature knob.
daemon = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:hf-hub",
    "dep:tokenizers",
]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { version = "0.11", optional = true, features = ["metal"] }

[dev-dependencies]
tempfile = "3"
serde_yaml = "0.9"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
