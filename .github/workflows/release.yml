# T100 — tag-triggered release: prebuilt binaries + generated notes.
#
# Cutting a `vX.Y.Z` tag (LOOP-SPEC Phase 3 tag doctrine: gates green at
# HEAD, one tag per wrap max, tags immutable) publishes:
#   - chug-<platform>.tar.gz + .sha256 for macos-arm64 (macos-15, the
#     primary), linux-x86_64 and linux-aarch64 (cross-compiled on
#     ubuntu-22.04 — no native arm64 ubuntu-22.04 runner), built
#     `--release --locked` against the tagged commit;
#   - a GitHub Release whose body is scripts/release-notes.sh's mechanical
#     grouping of the semantic commits since the previous tag.
#
# T347 — why this shape: GitHub retired the `macos-14` arm64 hosted label
# after v0.17.27, and every release run for v0.17.28..v0.21.0 died at runner
# provisioning in seconds ("The configuration 'macos-14-arm64-us-default' is
# not supported") — so releases stalled at v0.17.27 while tags kept coming.
# Three guards now: the arm64 leg runs on `macos-15`; a workflow-level
# concurrency group with `cancel-in-progress: false` means nothing (a
# re-tag, a queue pileup, a future mechanism) cancels an in-flight release
# build; and a `workflow_dispatch` `tag` input is the durable backfill —
# re-running an old tag's failed run re-uses the OLD workflow file, so only
# a dispatch from THIS file (checking out `inputs.tag`) can rebuild a tag
# whose run predates it.
#
# Supply-chain hygiene: every `uses:` is pinned by full 40-hex commit SHA
# (never a moving tag/branch ref). The release is created by the preinstalled
# `gh` CLI — no third-party release action — with `--verify-tag` so gh can
# never implicitly create a tag. The version check fails the run before the
# build when the tag disagrees with Cargo.toml (req 3).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to (re)build (T347 backfill, e.g. v0.21.0) — empty falls through to the triggering ref"
        required: false
        default: ""
        type: string

# T347: a release build is never cancelled. One workflow-wide group, and an
# in-flight run always finishes — the starvation that stopped releases at
# v0.17.27 must not be re-introduceable by any future mechanism.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  # T347: the tag being released — `inputs.tag` on a manual backfill
  # dispatch, else the pushed tag name (on a v* push github.ref_name IS the
  # tag; on a dispatch it is the triggering BRANCH, so GITHUB_REF cannot
  # name what is being rebuilt).
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: checkout (full history — notes need the previous tag)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # T347 backfill: a dispatch from main must build the TAG's commit,
          # not main's — `inputs.tag` when dispatching, the pushed tag name
          # on a v* push (where this resolves to the same ref as before).
          ref: ${{ inputs.tag || github.ref_name }}

      - name: rust toolchain (stable + this job's target)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: tag matches Cargo.toml version (fail before building)
        # TAG (workflow env: dispatch input or pushed tag) with the pushed
        # GITHUB_REF as the fallback — the check always consumes the
        # event-derived tag, never a hardcoded version.
        run: scripts/check-tag-version.sh "${TAG:-${GITHUB_REF#refs/tags/}}"

      - name: aarch64 cross linker (ubuntu arm64 leg only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        # T364: azure mirror DNS killed the aarch64 leg twice (run 43045899125) — the run block pins apt to archive.ubuntu.com and retries with backoff so one mirror wobble cannot kill a release.
        run: |
          # T364 (run 43045899125): the azure mirror is a speed optimization,
          # not a correctness dependency — rewrite it away BEFORE any apt call
          # (jammy runners drive apt through /etc/apt/apt-mirrors.txt; sed
          # both, tolerate absence).
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          # Retry with backoff: 3 attempts, 10s/30s/90s — a ~2-minute DNS
          # wobble must not fail the build; the step still fails if all three
          # attempts do (the recorded rc is consumed below, never swallowed).
          apt_ok=1
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross; then
              apt_ok=0
              break
            fi
            echo "apt attempt ${attempt}/3 failed (azure mirror DNS?); backing off"
            case "${attempt}" in
              1) sleep 10 ;;
              2) sleep 30 ;;
              3) sleep 90 ;;
            esac
          done
          if [ "${apt_ok}" -ne 0 ]; then
            echo "apt failed after all 3 attempts (10s/30s/90s backoff) — see T364, run 43045899125"
            exit 1
          fi

      - name: build (release, locked, with the judge daemon)
        # T204/F15: release binaries ship the baked-in judge daemon (metal on
        # macos-15, cpu on linux). `cargo build --release --locked` stays a
        # substring (tests/release_workflow.rs pins it); the `daemon` feature
        # adds candle/hf-hub/tokenizers.
        run: cargo build --release --locked --features daemon --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: package (tar.gz + sha256)
        # T341: the tarball carries the meta pack (hooks/) beside the binary —
        # install.sh --with-meta-pack extracts the pack from the SAME verified
        # tarball it already downloads (no second fetch). The hooks/ copy and
        # the `chug hooks` tar args are pinned by tests/release_workflow.rs.
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/chug" dist/chug
          cp -R hooks dist/hooks
          tar -czf "dist/chug-${{ matrix.platform }}.tar.gz" -C dist chug hooks
          rm dist/chug
          rm -rf dist/hooks
          if command -v sha256sum >/dev/null 2>&1; then SUM="sha256sum"; else SUM="shasum -a 256"; fi
          (cd dist && $SUM "chug-${{ matrix.platform }}.tar.gz" > "chug-${{ matrix.platform }}.tar.gz.sha256")
          cat "dist/chug-${{ matrix.platform }}.tar.gz.sha256"

      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chug-${{ matrix.platform }}
          path: |
            dist/chug-${{ matrix.platform }}.tar.gz
            dist/chug-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish the GitHub release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: checkout (full history — notes need the previous tag)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          # Same T347 backfill ref as the build job: the notes and the
          # release must describe the tag's history, not main's.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: generate release notes (mechanical, since the previous tag)
        # TAG (workflow env) — on a backfill dispatch GITHUB_REF is the
        # triggering branch, so the tag must come from the dispatch input.
        run: |
          scripts/release-notes.sh "${TAG}" > release-notes.md
          cat release-notes.md

      - name: create the GitHub release with the archives attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${TAG}" \
            --verify-tag \
            --title "chug ${TAG}" \
            --notes-file release-notes.md \
            dist/chug-*.tar.gz dist/chug-*.tar.gz.sha256
